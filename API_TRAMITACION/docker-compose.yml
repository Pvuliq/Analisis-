version: "3.4"

services:
  api_tramitacion:
    image: api_tramitacion
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT_API=8080
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=BD02_TRAMITACION
      - DB_PORT=3306
      - DB_HOST=host.docker.internal